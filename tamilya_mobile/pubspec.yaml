name: tamilya_mobile
description: "Tamilya, l'assistante qui apprend le shimaoré (application mobile)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  supabase_flutter: ^2.18.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fond/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
